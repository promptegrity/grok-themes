"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:surface1)\
$os\
$username\
[](bg:surface0 fg:surface1)\
$directory\
[](bg:surface2 fg:surface0)\
$git_branch\
$git_status\
[](fg:surface2)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$conda\
$time\
$cmd_duration\
$line_break\
$character"""

palette = 'grok_night'

[os]
disabled = false
style = "bg:surface1 fg:subtext1"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:surface1 fg:text"
style_root = "bg:surface1 fg:maroon"
format = '[ $user ]($style)'

[directory]
style = "bg:surface0 fg:subtext1"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:surface2"
format = '[[ $symbol $branch ](fg:yellow bg:surface2)]($style)'

[git_status]
style = "bg:surface2"
format = '[[($all_status$ahead_behind )](fg:peach bg:surface2)]($style)'

[nodejs]
symbol = ""
style = "fg:overlay2"
format = '[[ $symbol( $version) ](fg:overlay2)]($style)'

[c]
symbol = " "
style = "fg:overlay2"
format = '[[ $symbol( $version) ](fg:overlay2)]($style)'

[rust]
symbol = ""
style = "fg:overlay2"
format = '[[ $symbol( $version) ](fg:overlay2)]($style)'

[golang]
symbol = ""
style = "fg:overlay2"
format = '[[ $symbol( $version) ](fg:overlay2)]($style)'

[php]
symbol = ""
style = "fg:overlay2"
format = '[[ $symbol( $version) ](fg:overlay2)]($style)'

[java]
symbol = " "
style = "fg:overlay2"
format = '[[ $symbol( $version) ](fg:overlay2)]($style)'

[kotlin]
symbol = ""
style = "fg:overlay2"
format = '[[ $symbol( $version) ](fg:overlay2)]($style)'

[haskell]
symbol = ""
style = "fg:overlay2"
format = '[[ $symbol( $version) ](fg:overlay2)]($style)'

[python]
symbol = ""
style = "fg:overlay2"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:overlay2)]($style)'

[docker_context]
symbol = ""
style = "fg:overlay2"
format = '[[ $symbol( $context) ](fg:overlay2)]($style)'

[conda]
symbol = "  "
style = "fg:overlay2"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "fg:overlay1"
format = '[[  $time ](fg:overlay1)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:text)'
error_symbol = '[❯](bold fg:maroon)'
vimcmd_symbol = '[❮](bold fg:subtext1)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = false
format = " [$duration](fg:overlay2)"
style = "fg:overlay2"
disabled = false
show_notifications = true
min_time_to_notify = 45000


# Grok Night — deep grays + restrained accents (SpaceX / grok-build)
